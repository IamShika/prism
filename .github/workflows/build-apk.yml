name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk PrismMusicPlayer.apk

      # Every build: download the APK from the "Actions" tab (Artifacts section)
      - uses: actions/upload-artifact@v4
        with:
          name: PrismMusicPlayer-apk
          path: PrismMusicPlayer.apk

      # Tagged builds (e.g. v0.1.0): publish it on the Releases page for everyone
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PrismMusicPlayer.apk
          generate_release_notes: true
