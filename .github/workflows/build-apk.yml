name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach the APK to a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's build machines already have the Android SDK installed.
      # We only need to make sure its licences are accepted.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # If you added the signing secrets (see README, "Signing"), use your permanent key.
      # If not, the build still works with a temporary debug key.
      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/prism-release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/prism-release.jks" >> "$GITHUB_ENV"
            echo "Using the permanent release key."
          else
            echo "No signing secrets found. Using the temporary debug key."
          fi

      # TEMPORARY: prints facts about the key (never the secrets) to help find mistakes.
      # Safe to delete this whole step once signing works.
      - name: Check signing key
        if: env.KEYSTORE_PATH != ''
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "keystore file sha256: $(sha256sum "$KEYSTORE_PATH" | cut -d' ' -f1)"
          echo "KEY_ALIAS secret length: ${#KEY_ALIAS} characters (expected 5 for 'prism')"
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" 2>&1 | grep -E "Keystore type|Your keystore contains|PrivateKeyEntry|trustedCertEntry|error|Exception" || true

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk PrismMusicPlayer.apk

      # Every build: download the APK from the "Actions" tab (Artifacts section)
      - uses: actions/upload-artifact@v4
        with:
          name: PrismMusicPlayer-apk
          path: PrismMusicPlayer.apk

      # Tagged builds (e.g. v0.1.0): publish it on the Releases page for everyone
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PrismMusicPlayer.apk
          generate_release_notes: true
